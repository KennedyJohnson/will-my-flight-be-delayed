name: Deploy flight-lookup Worker

# Deploys worker/ to Cloudflare. Needs repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# RAPIDAPI_KEY; skips (green) until they exist.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.RAPIDAPI_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'
      - name: Deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            RAPIDAPI_KEY
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      - name: Skipped
        if: env.HAS_SECRETS != 'true'
        run: echo "Cloudflare/RapidAPI secrets not set yet; nothing deployed."
